# SPDX-License-Identifier: MIT
# Marks pull requests that conflict with main as "needs rebase".
name: Conflict label

on:
  push:
    branches: [main]
  pull_request_target:
    types: [synchronize]
  workflow_dispatch:

permissions: {}

concurrency:
  group: conflict-label
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: needs rebase
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          commentOnDirty: This pull request conflicts with `main`. Please rebase it on the current `main`.
