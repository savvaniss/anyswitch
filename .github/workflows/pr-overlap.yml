# SPDX-License-Identifier: MIT
# Comments on open pull requests that change the same lines or add the same
# guest exports as another open pull request (tools/pr_overlap.py). Runs the
# script from main; pull request code is only read through the GitHub API.
name: PR overlap

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-overlap

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find overlaps and update comments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out="$RUNNER_TEMP/overlap"
          python3 -I tools/pr_overlap.py --all --repo "$GH_REPO" --out "$out"
          marker='<!-- pr-overlap -->'
          shopt -s nullglob
          for file in "$out"/*.md; do
            pr=$(basename "$file" .md)
            existing=$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | [.id, .body] | @json" | head -n1)
            id=$(jq -r '.[0] // empty' <<< "${existing:-null}")
            if [ -s "$file" ]; then
              [ "$(jq -r '.[1] // empty' <<< "${existing:-null}")" = "$(cat "$file")" ] && continue
              if [ -n "$id" ]; then
                gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@"$file" > /dev/null
              else
                gh pr comment "$pr" --body-file "$file"
              fi
            elif [ -n "$id" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/comments/$id"
            fi
          done
