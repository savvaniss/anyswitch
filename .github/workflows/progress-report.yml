# SPDX-License-Identifier: MIT
# Computes how a pull request changes the progress numbers (exports, gaps,
# corpus cases, roadmap). Runs with a read-only token; progress-comment.yml
# posts the result.
name: Progress report

on:
  pull_request:
    paths:
      - core/relinker/include/nx/relinker/patcher.hpp
      - docs/dev/debt/**
      - docs/roadmap.json
      - runtime/src/**
      - tests/corpus/cases.json
      - tools/site/progress.py
      - .github/workflows/progress-report.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compare the base branch with the pull request
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          out="$RUNNER_TEMP/out" report="$RUNNER_TEMP/report"
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          python3 -I tools/site/progress.py --root "$RUNNER_TEMP/base" "$out/base"
          python3 -I tools/site/progress.py "$out/head"
          mkdir -p "$report"
          echo "$PR" > "$report/pr"
          body=$(python3 -I tools/site/progress.py --compare "$out/base/progress.json" "$out/head/progress.json")
          if [ -n "$body" ]; then
            printf '### Progress (%s → %s)\n\n%s\n' "$(git rev-parse --short HEAD^1)" "${HEAD_SHA::7}" "$body" > "$report/report.md"
            cat "$report/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: progress-report
          path: ${{ runner.temp }}/report
