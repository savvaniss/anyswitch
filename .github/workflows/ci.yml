# SPDX-License-Identifier: MIT
name: ci

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check repository conventions (AGENTS.md)
        run: python3 -I tools/check_conventions.py --base "${{ github.event.before }}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflow files
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Lint shell scripts
        run: shellcheck tools/dev/*.sh tools/bootstrap/*.sh cmake/zig/zig-*
      - name: Build the Pages site
        run: python3 -I tools/site/build_site.py "$RUNNER_TEMP/site"

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release -DANYSWITCH_WERROR=ON
      - name: Build
        run: cmake --build build/host --config Release
      - name: Unit tests
        run: ctest --test-dir build/host -C Release --output-on-failure

  corpus-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install qemu-user and an AArch64 sysroot
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static libc6-arm64-cross ninja-build
      - name: Fetch Zig
        run: |
          QEMU_AARCH64="$(command -v qemu-aarch64-static)"
          export QEMU_AARCH64
          export AARCH64_SYSROOT=/usr/aarch64-linux-gnu
          tools/bootstrap/fetch_toolchain.sh
      - name: Build
        run: tools/dev/build.sh
      - name: Unit tests and corpus under qemu
        run: tools/dev/test.sh

  corpus-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Fetch Zig
        run: tools/bootstrap/fetch_toolchain.sh
      - name: Build
        run: tools/dev/build.sh
      - name: Unit tests and corpus, native
        run: tools/dev/test.sh
