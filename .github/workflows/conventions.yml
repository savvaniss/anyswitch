# SPDX-License-Identifier: MIT
# Checks pull requests against AGENTS.md with the checker from the base
# branch, so a pull request cannot weaken the checks it is judged by. The
# pull request's code is fetched as git objects and never executed.
name: Conventions

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request's objects without checking them out
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - name: Check conventions with the base branch's checker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I tools/check_conventions.py --base "$BASE_SHA" --head "$HEAD_SHA"
