# SPDX-License-Identifier: MIT
name: Bring-up report
description: Report how far a title you own gets, without sharing any of its data.
labels: [bring-up]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please share only what is asked below. Do **not** attach or paste executables, dumps, symbol lists, logs containing game text, screenshots, or file names that identify where you got the files. Do not ask how to obtain game files or keys; such issues are closed.
  - type: input
    id: title
    attributes:
      label: Title name and version
      description: The public name, for example "Example Game 1.0.2". No program IDs needed.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: anyswitch commit
      placeholder: output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      placeholder: "e.g. Raspberry Pi 5, Debian 13, 4 KiB pages / x86-64 + qemu-user"
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Audit summary
      description: Only the summary lines of `anyswitch-relink audit --registry libnxrt.so exefs/` ("main: N of M imports provided, K missing"), not the list.
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Where it stops
      description: The `[nxrt] fatal:` or `[nxrt] guest crash:` line, including the function name or `module+offset`.
    validations:
      required: true
