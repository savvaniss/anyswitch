# SPDX-License-Identifier: MIT
name: Bug in the tools or runtime
description: Something in anyswitch itself is wrong, reproducible with the synthetic corpus or a homebrew program.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, ideally using `tools/dev/test.sh` or a small corpus case. No commercial game files.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: anyswitch commit
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host OS, CPU and compiler
    validations:
      required: true
